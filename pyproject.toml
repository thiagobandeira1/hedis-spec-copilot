[project]
name = "hedis-spec-copilot"
version = "0.1.0"
description = "RAG copilot over public CMS Star Ratings / HEDIS measure descriptions with cited answers and an honest retrieval + faithfulness eval harness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thiago Bandeira", email = "thiagobatistanb@gmail.com" }]
dependencies = [
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "rank-bm25>=0.2",
    "streamlit>=1.39",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "clinical-agent-evals",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
    "types-beautifulsoup4>=4.12",
]

[project.scripts]
hedis = "hedis_copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedis_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# The CMS PDFs genuinely contain en dashes/bullets; the parser must match them literally.
"src/hedis_copilot/corpus/parse.py" = ["RUF001"]
"src/hedis_copilot/corpus/chunk.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hedis_copilot"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "fastembed.*", "rank_bm25.*", "streamlit.*", "langchain_community.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=hedis_copilot --cov-report=term-missing"
markers = [
    "embed: needs the cached FastEmbed model (runs in CI with cache)",
    "llm: needs a real ANTHROPIC_API_KEY (auto-skipped in CI)",
]

[tool.coverage.run]
source = ["src/hedis_copilot"]

[tool.uv.sources]
clinical-agent-evals = { git = "https://github.com/thiagobandeira1/clinical-agent-evals", rev = "v0.1.0" }
